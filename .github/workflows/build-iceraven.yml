name: Build Iceraven with bookmark export

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v7
        with:
          path: build-scripts

      - name: Checkout Iceraven 2.52.0
        uses: actions/checkout@v7
        with:
          repository: fork-maintainers/iceraven-browser
          ref: iceraven-2.52.0
          path: iceraven-src
          submodules: recursive
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Apply bookmark exporter and isolated package ID
        run: python3 build-scripts/patch_iceraven.py

      - name: Install Android SDK components
        working-directory: iceraven-src
        run: ./automation/iceraven/install-sdk.sh

      - name: Patch Android Components and prepare Python environment
        working-directory: iceraven-src
        run: |
          ./automation/iceraven/patch_android_components.sh
          ./automation/iceraven/setup_venv.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build arm64 APK
        working-directory: iceraven-src
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-XX:MaxMetaspaceSize=2g -Xms512m -Xmx5g -XX:+HeapDumpOnOutOfMemoryError"
        run: |
          free -h
          ./gradlew app:assembleForkRelease -PversionName=2.52.0-bookmark-export --stacktrace --no-daemon --max-workers=2
          echo "Built APK files:"
          find gradle/build/app/outputs/apk -type f -name '*.apk' -print

      - name: Sign and verify arm64 APK
        working-directory: iceraven-src
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="gradle/build/app/outputs/apk/forkRelease"
          UNSIGNED="$APK_DIR/app-arm64-v8a-forkRelease-unsigned.apk"
          SIGNED="$APK_DIR/app-arm64-v8a-forkRelease-signed.apk"
          test -f "$UNSIGNED"

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/iceraven-debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA -keysize 2048 -validity 10000

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/iceraven-debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED" "$UNSIGNED"

          "$APKSIGNER" verify --verbose "$SIGNED"
          echo "Verified signed APK: $SIGNED"

      - name: Upload signed arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: iceraven-2.52.0-bookmark-export-arm64
          path: iceraven-src/gradle/build/app/outputs/apk/forkRelease/app-arm64-v8a-forkRelease-signed.apk
          if-no-files-found: error
          retention-days: 14
